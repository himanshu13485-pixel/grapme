# Production stack: PostgreSQL + Redis + API + Web.
# Bring up with:  docker compose -f docker-compose.prod.yml up -d --build
# (the deploy.sh script does this for you, including generating .env)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aeo
    volumes:
      - aeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aeo']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - aeo_redisdata:/data

  api:
    # Pre-built image from GitHub Container Registry (built by CI, NOT on this
    # server). Override with APP_IMAGE in .env to pin a specific version/tag.
    image: ${APP_IMAGE:-ghcr.io/himanshu13485-pixel/grapme:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://aeo:${POSTGRES_PASSWORD}@postgres:5432/aeo?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_ENABLED: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      CORS_ORIGIN: ${WEB_PUBLIC_URL}
      # Preset super-admin — created automatically on first boot. No signup page.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Public "create workspace" signup stays OFF (login shows only sign-in +
      # client portal). Flip to "true" temporarily if you ever need it.
      ALLOW_ADMIN_SIGNUP: ${ALLOW_ADMIN_SIGNUP:-false}
      # ── LinkedIn channel (Unipile) + AI ── set these in .env for live
      # connect/send + AI personalization. Blank = features report "not configured".
      UNIPILE_DSN: ${UNIPILE_DSN:-}
      UNIPILE_API_KEY: ${UNIPILE_API_KEY:-}
      UNIPILE_WEBHOOK_SECRET: ${UNIPILE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # On plan/blog changes, ping the marketing site (cPanel app) to refresh its
      # live pricing + blog pages. Set MARKETING_REVALIDATE_URL to the public
      # endpoint, e.g. https://www.grapme.com/api/revalidate (leave blank to skip
      # and rely on the marketing site's own 2-min cache). REVALIDATE_SECRET, if
      # set, must match the value configured on the marketing app.
      MARKETING_REVALIDATE_URL: ${MARKETING_REVALIDATE_URL:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    # Apply DB migrations on boot, then start the API.
    command: >
      sh -c "npx prisma migrate deploy --schema=/app/apps/api/prisma/schema.prisma &&
             node apps/api/dist/src/main.js"
    # BIND_HOST=127.0.0.1 (in .env) exposes it only to a local reverse proxy
    # (cPanel/nginx). Default 0.0.0.0 = reachable directly on the server IP.
    ports:
      - '${BIND_HOST:-0.0.0.0}:4000:4000'

  web:
    image: ${APP_IMAGE:-ghcr.io/himanshu13485-pixel/grapme:latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Internal API URL for server-side image proxying (/media/assets/*).
      API_URL: ${WEB_API_URL:-http://api:4000/api/v1}
    command: sh -c "npm run start --workspace apps/web"
    ports:
      - '${BIND_HOST:-0.0.0.0}:3000:3000'

  # NOTE: the marketing site (grapme.com) is served separately as a cPanel
  # Node.js app, not from this stack — so there's no `marketing` service here.
  # It's rebuilt/restarted on its own; see docs/DEPLOY_CPANEL.md.

volumes:
  aeo_pgdata:
  aeo_redisdata:
